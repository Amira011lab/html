<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First CSS Card</title>
  <style>
    body {
      background-color: #f0f4f8;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background-color: white;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      width: 300px;
      text-align: center;
      padding: 20px;
    }

    .card img {
      width: 100px;
      border-radius: 50%;
      margin-top: 10px;
    }

    .card h2 {
      color: #333;
    }

    .card p {
      color: #555;
      font-size: 14px;
    }

    .card button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
    }

    .card button:hover {
      background-color: #0056b3;
      

    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgb (0,0,0,0.3);
      transition: all 0.4s ease;


    }
  </style>
</head>
<body>

  <div class="card">
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile">
    <h2>Samira Guray</h2>
    <p>Frontend Developer in training 💻</p>
    <button>Follow</button>
  </div>

</body>
</html>
